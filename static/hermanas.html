<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e27">
<title>FUTURA — Hermanas</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .vs { display: flex; align-items: center; gap: 10px; margin: 16px 0; }
  .vs .side { flex: 1; text-align: center; }
  .vs .circle {
    width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: #fff;
  }
  .vs .name { font-size: 13px; font-weight: 700; }
  .vs .xp { font-size: 11px; color: var(--text-muted); }
  .vs .middle { font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .last {
    background: var(--bg-elevated); border-radius: 12px; padding: 14px;
  }
  .last .t { font-size: 13px; font-weight: 700; }
  .last .m { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .encourage { font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="page-title">👭 Hermanas</div>
    <div class="header-right">
      <div class="theme-switch" id="themeSwitch"><div class="knob" id="themeKnob">🌙</div></div>
    </div>
  </div>

  <div id="content"><div class="loading">Cargando…</div></div>
</div>

<div id="nav"></div>

<script src="/static/app.js"></script>
<script>
const COLORS = ["linear-gradient(135deg,#f472b6,#7c3aed)", "linear-gradient(135deg,#38bdf8,#22c55e)"];

async function boot() {
  Futura.initTheme();
  Futura.mountThemeSwitch();
  Futura.mountNav("hermanas");

  const me = await Futura.currentUser();
  const data = await Futura.api(`/api/users/${me.id}/sisters`);
  const meSummary = await Futura.api(`/api/users/${me.id}/summary`);

  const sister = data.sister;
  const maxXp = Math.max(meSummary.xp, sister.xp, 1);
  const meBar = Math.round((100 * meSummary.xp) / maxXp);
  const sisBar = Math.round((100 * sister.xp) / maxXp);

  const lastHtml = data.last_parcours
    ? `<div class="last">
         <div class="t">${Futura.escapeHtml(data.last_parcours.title)}</div>
         <div class="m">Terminé le ${Futura.formatDate(data.last_parcours.completed_at)} · +${data.last_parcours.xp_reward} XP</div>
       </div>`
    : `<div class="empty">${Futura.escapeHtml(sister.name)} n'a encore rien terminé.</div>`;

  const diff = sister.xp - meSummary.xp;
  const msg = diff > 0
    ? `${Futura.escapeHtml(sister.name)} a ${diff} XP d'avance. À toi de jouer ! 💪`
    : diff < 0
      ? `Tu as ${Math.abs(diff)} XP d'avance sur ${Futura.escapeHtml(sister.name)}. Bravo ! 🎉`
      : `Vous êtes exactement à égalité. 🤝`;

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">⚖️ EL DUELO AMISTOSO</div>
      <div class="vs">
        <div class="side">
          <div class="circle" style="background:${COLORS[0]}">${Futura.escapeHtml(me.name.charAt(0).toUpperCase())}</div>
          <div class="name">${Futura.escapeHtml(me.name)} <span style="font-size:10px;color:var(--accent-blue);">(tú)</span></div>
          <div class="xp">${meSummary.xp} XP</div>
        </div>
        <div class="middle">VS</div>
        <div class="side">
          <div class="circle" style="background:${COLORS[1]}">${Futura.escapeHtml(sister.name.charAt(0).toUpperCase())}</div>
          <div class="name">${Futura.escapeHtml(sister.name)}</div>
          <div class="xp">${sister.xp} XP</div>
        </div>
      </div>
      <div class="bar" style="margin-bottom:6px;"><div class="bar-fill" style="width:${meBar}%;background:linear-gradient(90deg,#f472b6,#7c3aed)"></div></div>
      <div class="bar"><div class="bar-fill" style="width:${sisBar}%;background:linear-gradient(90deg,#38bdf8,#22c55e)"></div></div>
      <div class="encourage" style="margin-top:14px;">${msg}</div>
    </div>

    <div class="card">
      <div class="card-title">📊 ${Futura.escapeHtml(sister.name.toUpperCase())} EN NÚMEROS</div>
      <div style="display:flex;gap:10px;text-align:center;">
        <div style="flex:1;background:var(--bg-elevated);border-radius:12px;padding:12px;">
          <div style="font-size:18px;font-weight:800;">${sister.parcours_done}</div>
          <div style="font-size:10px;color:var(--text-muted);">Parcours finis</div>
        </div>
        <div style="flex:1;background:var(--bg-elevated);border-radius:12px;padding:12px;">
          <div style="font-size:18px;font-weight:800;">${sister.badges.length}</div>
          <div style="font-size:10px;color:var(--text-muted);">Distintivos</div>
        </div>
        <div style="flex:1;background:var(--bg-elevated);border-radius:12px;padding:12px;">
          <div style="font-size:18px;font-weight:800;">${sister.progress_percent}%</div>
          <div style="font-size:10px;color:var(--text-muted);">Programme</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
        ${sister.badges.map((b) => `<span class="chip done">${b.icon} ${Futura.escapeHtml(b.name)}</span>`).join("") || `<span class="chip">Aucun distintivo</span>`}
      </div>
    </div>

    <div class="card">
      <div class="card-title">🕐 SU ÚLTIMO PARCOURS</div>
      ${lastHtml}
    </div>

    <div class="card">
      <div class="card-title">💬 UN MENSAJE PARA ELLA</div>
      <div class="encourage">
        Elige un parcours que ${Futura.escapeHtml(sister.name)} ya terminó y pregúntale cómo lo resolvió.
        Enseñar lo que uno aprende es la mejor forma de aprender dos veces.
      </div>
    </div>
  `;
}

boot().catch((error) => {
  document.getElementById("content").innerHTML =
    `<div class="empty">⚠️ ${Futura.escapeHtml(error.message)}</div>`;
});
</script>
</body>
</html>
