<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e27">
<title>FUTURA — Laboratorio</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .lab-card {
    background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 16px; padding: 16px; margin-bottom: 12px;
  }
  .lab-card .head { display: flex; align-items: flex-start; gap: 10px; }
  .lab-card .head .txt { flex: 1; }
  .lab-card .title { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .lab-card .field { font-size: 10px; color: var(--accent-blue); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .lab-card .xp { font-size: 11px; color: var(--accent-green); font-weight: 700; }
  details { margin-top: 12px; }
  summary {
    cursor: pointer; font-size: 12px; color: var(--accent-blue);
    font-weight: 700; list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  .answer { margin-top: 10px; padding: 10px 12px; background: var(--bg-elevated); border-radius: 10px; }
  .answer .q { font-size: 10px; font-weight: 700; color: var(--accent-purple); letter-spacing: 1px; }
  .answer .a { font-size: 12px; line-height: 1.5; margin-top: 3px; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="page-title">🎓 Mi Laboratorio</div>
    <div class="header-right">
      <div class="theme-switch" id="themeSwitch"><div class="knob" id="themeKnob">🌙</div></div>
    </div>
  </div>

  <div id="content"><div class="loading">Cargando…</div></div>
</div>

<div id="nav"></div>

<script src="/static/app.js"></script>
<script>
async function boot() {
  Futura.initTheme();
  Futura.mountThemeSwitch();
  Futura.mountNav("laboratorio");

  const user = await Futura.currentUser();
  const [progress, parcours] = await Promise.all([
    Futura.api(`/api/users/${user.id}/progress`),
    Futura.api(`/api/parcours/?target=${encodeURIComponent(user.name)}`),
  ]);

  const done = parcours.filter((p) => progress[p.id] && progress[p.id].completed);

  if (!done.length) {
    document.getElementById("content").innerHTML = `
      <div class="empty">
        <div style="font-size:36px;margin-bottom:12px;">🧪</div>
        <p>Tu laboratorio está vacío.</p>
        <p style="margin-top:8px;">Cada parcours que termines aparecerá aquí con tus respuestas del carnet PISA.</p>
        <a href="/" class="btn btn-primary" style="margin-top:16px;">Empezar un parcours →</a>
      </div>`;
    return;
  }

  const details = await Promise.all(done.map((p) => Futura.api(`/api/parcours/${p.id}`)));
  const progresses = await Promise.all(
    done.map((p) => Futura.api(`/api/parcours/${p.id}/progress?user_id=${user.id}`))
  );

  const html = done.map((p, i) => {
    const full = details[i];
    const prog = progresses[i];
    const meta = prog.metacognition || {};

    const answers = (full.carnet || []).map((q) => `
      <div class="answer">
        <div class="q">${Futura.escapeHtml(q.process).toUpperCase()}</div>
        <div class="a">${Futura.escapeHtml(prog.carnet[q.process] || "—")}</div>
      </div>`).join("");

    const metaHtml = (meta.facil || meta.dificil || meta.diferente) ? `
      <div class="answer">
        <div class="q">MÉTACOGNITION</div>
        <div class="a">${[
          meta.facil ? "Fácil: " + meta.facil : "",
          meta.dificil ? "Difícil: " + meta.dificil : "",
          meta.diferente ? "La próxima vez: " + meta.diferente : "",
        ].filter(Boolean).map(Futura.escapeHtml).join("\n")}</div>
      </div>` : "";

    const laboHref = full.labo && full.labo.file
      ? (full.labo.file.startsWith("/") ? full.labo.file : "/" + full.labo.file)
      : null;

    return `
      <div class="lab-card">
        <div class="head">
          <div class="txt">
            <div class="field">${Futura.escapeHtml(p.field).replace(/_/g, " ").toUpperCase()}</div>
            <div class="title">${Futura.escapeHtml(p.title)}</div>
          </div>
          <div class="xp">+${prog.xp_earned || p.xp_reward} XP</div>
        </div>
        <details>
          <summary>📓 Ver mi carnet PISA</summary>
          ${answers || `<div class="empty">Carnet vide.</div>`}
          ${metaHtml}
        </details>
        <div class="actions">
          <a class="btn btn-ghost btn-sm" href="/static/parcours_template.html?id=${encodeURIComponent(p.id)}">Repasar</a>
          ${laboHref ? `<a class="btn btn-primary btn-sm" href="${laboHref}" target="_blank" rel="noopener">Abrir el laboratorio →</a>` : ""}
        </div>
      </div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-title">🎓 MI PORTAFOLIO</div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.6;">
        ${done.length} parcours terminé${done.length > 1 ? "s" : ""}. Chaque fiche contient tes réponses
        du carnet PISA : c'est la trace de ton raisonnement, pas seulement du résultat.
      </div>
    </div>
    ${html}
  `;
}

boot().catch((error) => {
  document.getElementById("content").innerHTML =
    `<div class="empty">⚠️ ${Futura.escapeHtml(error.message)}</div>`;
});
</script>
</body>
</html>
